<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AOC Quests</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@600&display=swap">
<style>
:root{--navy:#1B2540;--jade:#3EC5B6;--jade-ink:#12756B;--lav:#8E7AF3;--pink:#FF8CA7;--gold:#F4C95D;--cream:#FFF8ED;--surface:#FFFDF8;--line:#EBDCC3;--muted:#5E6478;--shadow:0 6px 18px rgba(27,37,64,.10);--display:"Fredoka","Nunito",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--navy);font-family:"Nunito",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:18px}
.hero{position:relative;border-radius:28px;overflow:hidden;min-height:250px;box-shadow:var(--shadow);display:flex;align-items:flex-end}
.hero .scene{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;margin:16px;display:flex;align-items:center;gap:16px;background:rgba(255,253,248,.88);backdrop-filter:blur(6px);border-radius:22px;padding:14px 18px;box-shadow:var(--shadow)}
.av{width:86px;height:86px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--gold);flex:none}
.hero h1{margin:0;font-family:var(--display);font-size:32px;line-height:1.1}
.hero p{margin:4px 0 0;color:var(--muted);font-weight:700}
h2{font-family:var(--display);font-size:24px;margin:4px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.quest{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--navy);background:linear-gradient(180deg,#FFFDF8,#FBF1DF);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.quest:hover,.quest:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px rgba(27,37,64,.16);outline:none}
.qi{font-size:44px;line-height:1;width:64px;height:64px;display:grid;place-items:center;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);flex:none}
.quest span{display:flex;flex-direction:column;min-width:0}
.quest b{font-weight:900;font-size:20px}
.quest small{color:var(--muted);font-weight:700;font-size:14px}
.quest em{font-style:normal;font-weight:800;font-size:13px;color:var(--jade-ink);margin-top:4px}
.note{text-align:center;color:var(--muted);font-size:13px;margin:0}
@media (max-width:480px){.hero h1{font-size:26px}.av{width:70px;height:70px}}
@media (prefers-reduced-motion:reduce){.quest{transition:none}}
</style></head><body>
